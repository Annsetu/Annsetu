  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap');

.role-section {
  font-family: 'Poppins', sans-serif;
  min-height: 30vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: #f5f2e7; /* earthy light background */
  color: #2c3e50;
  padding: 20px;
}

/* Heading */
.statement h1 {
  font-size: 2.8rem;
  font-weight: 700;
  margin-bottom: 30px;
  color: #2e7d32; /* dark green */
  text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
  animation: fadeInDown 1s ease;
}

/* Gradient Box Behind Buttons */
.role-box {
  background: linear-gradient(135deg, #ffffff, #fef8e7);
  border-radius: 16px;
  padding: 35px 25px;
  display: inline-flex;
  gap: 25px;
  flex-wrap: wrap;
  justify-content: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  animation: fadeInUp 1.2s ease;
}

/* Buttons */
.role-btn {
  display: inline-block;
  padding: 14px 40px;
  font-size: 1.2rem;
  font-weight: 600;
  border-radius: 35px;
  text-decoration: none;
  color: white;
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

/* Farmer Button */
.farmer-role {
  background: linear-gradient(45deg, #4caf50, #81c784); /* green shades */
}

/* Buyer Button */
.buyer-role {
  background: linear-gradient(45deg, rgb(75, 115, 125), rgb(90, 110, 125)); /* golden shades */
}

/* Hover Effects */
.role-btn:hover {
  transform: translateY(-6px) scale(1.07);
  box-shadow: 0 12px 28px rgba(0,0,0,0.4);
}

.role-btn::before {
  content: "";
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: rgba(255,255,255,0.25);
  transition: all 0.5s ease;
}

.role-btn:hover::before {
  left: 100%;
}

/* Animations */
@keyframes fadeInDown {
  0% { opacity: 0; transform: translateY(-30px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}
